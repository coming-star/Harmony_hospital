server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

spring:
  application:
    name: his-springboot

  datasource:
    url: jdbc:mysql://localhost:3306/neusoft_cloud_hospital?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    deserialization:
      fail-on-unknown-properties: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: "123456"
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cache:
    type: redis

# RocketMQ 5.3.0：订单超时延迟消息 + 订单状态事件(站内信)。
# NameServer 未启动时应用仍可正常运行：发送失败只打 warn 日志，超时取消由定时兜底任务(5 分钟)保证。
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: his_order_producer_group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

app:
  jwt:
    secret: NeusoftCloudHospitalJwtSecretKey2026!
    expire-hours: 24
  ai:
    deepseek:
      # DeepSeek API Key：优先读环境变量 DEEPSEEK_API_KEY；不设置时接口会提示未配置。
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-chat
  security:
    # 身份证 AES-GCM 加密密钥（32 字节 hex = 256 位）。生产环境务必用环境变量 ID_CARD_AES_KEY 覆盖。
    id-card-aes-key: ${ID_CARD_AES_KEY:0123456789abcdef0123456789abcdef}
  upload:
    # 头像上传本地存储目录与访问 URL 前缀
    avatar-dir: ${UPLOAD_AVATAR_DIR:./uploads/avatars}
    avatar-url-prefix: ${UPLOAD_AVATAR_URL_PREFIX:http://localhost:8081/static/avatars}